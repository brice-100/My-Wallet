services:
  pfm-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
    container_name: my-wallet-pfm
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production
